<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Una galería editorial alimentada por la API de Picsum.">
    <title>Archivo visual | Galería</title>
    <style>
        :root { --ink: #17211b; --muted: #657169; --paper: #f5f1e8; --panel: rgba(255, 253, 248, 0.84); --accent: #d95f38; --line: rgba(23, 33, 27, 0.14); --shadow: 0 18px 50px rgba(46, 38, 27, 0.12); }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; color: var(--ink); font-family: Georgia, "Times New Roman", serif; background: radial-gradient(circle at 12% 10%, rgba(217, 95, 56, 0.2), transparent 26rem), linear-gradient(135deg, #f7f3ea 0%, #e6ece3 100%); }
        body::before { position: fixed; inset: 0; z-index: -1; opacity: 0.25; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 34px 34px; content: ""; mask-image: linear-gradient(to bottom, black, transparent 70%); }
        .contenedor { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 72px; }
        .cabecera { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 38px; border-bottom: 1px solid var(--line); padding-bottom: 26px; }
        .eyebrow { margin: 0 0 12px; color: var(--accent); font: 700 0.72rem/1.2 Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
        h1 { max-width: 620px; margin: 0; font-size: clamp(2.8rem, 7vw, 6.4rem); font-weight: 400; line-height: 0.9; letter-spacing: 0; }
        .descripcion { max-width: 300px; margin: 0; color: var(--muted); font: 0.95rem/1.5 Arial, sans-serif; }
        .btn-cargar { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 13px 18px; border: 1px solid var(--ink); border-radius: 999px; color: var(--paper); background: var(--ink); font: 700 0.8rem Arial, sans-serif; letter-spacing: 0.04em; cursor: pointer; transition: transform 180ms ease, background 180ms ease; }
        .btn-cargar::after { content: "↗"; font-size: 1rem; }
        .btn-cargar:hover { transform: translateY(-2px); background: var(--accent); }
        .btn-cargar:disabled { cursor: wait; opacity: 0.65; transform: none; }
        .estado { min-height: 22px; margin: 0 0 20px; color: var(--muted); font: 0.78rem Arial, sans-serif; }
        .error { color: #a93428; }
        .galeria { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        .img-card { overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); box-shadow: var(--shadow); animation: aparecer 500ms both; }
        .img-card:nth-child(2n) { transform: translateY(24px); }
        .img-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: saturate(0.82); transition: transform 400ms ease, filter 400ms ease; }
        .img-card:hover img { transform: scale(1.05); filter: saturate(1); }
        .img-card h2 { margin: 0; padding: 15px 16px 17px; font-size: 1.05rem; font-weight: 400; }
        @keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 850px) { .galeria { grid-template-columns: repeat(2, 1fr); } .img-card:nth-child(2n) { transform: none; } }
        @media (max-width: 560px) { .contenedor { width: min(100% - 28px, 440px); padding-top: 34px; } .cabecera { display: block; } .galeria { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="contenedor">
        <header class="cabecera">
            <div>
                <p class="eyebrow">Colección abierta / 01</p>
                <h1>Archivo<br>visual</h1>
            </div>
            <div>
                <p class="descripcion">Una selección cambiante de imágenes para mirar con calma.</p>
                <button class="btn-cargar" type="button">Cargar imágenes</button>
            </div>
        </header>
        <p class="estado" aria-live="polite">Pulsa el botón para explorar la colección.</p>
        <div class="galeria"></div>
    </div>

    <script src="galeria.js"></script>
</body>
</html>
